[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "run3-mj-slimmer"
version = "1.0.0"
description = "ScoutingNanoAOD slimmer for the 6-jet multijet analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uproot>=5.0",
    "awkward>=2.0",
    "numpy>=1.20",
    "boost-histogram>=1.3",
    "fsspec_xrootd",
    # JEC/JER via coffea.jetmet_tools driven by JME POG .txt files.
    # Pinned for a reproducible jetmet_tools API; this release is compatible
    # with the modern numpy/scipy/numba stack (coffea 2024.x needs old scipy).
    "coffea==2026.5.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
run3-mj-slimmer = "run3_mj_slimmer.slim:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# JME correction .txt files dropped into src/run3_mj_slimmer/data/jme/ are
# shipped inside the wheel, so condor jobs need no extra file transfers.
run3_mj_slimmer = ["data/jme/*.txt", "data/jme/*.txt.gz"]
